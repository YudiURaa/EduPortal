.q-act-surr{background:#f5f5f5;color:#666;border-color:#e0e0e0}
.fb-icon{font-size:4rem;margin-bottom:12px}
.fb-title{font-size:1.8rem;font-weight:700;margin-bottom:4px}
.fb-sub{font-size:1rem;color:#666;margin-bottom:16px}

.sb-score{font-weight:700;font-size:1.2rem}

.win-rank-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0e8ff}

.pause-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:9999}

@media(max-width:600px){.mc{width:18px;height:18px;font-size:0.4rem}.pm{font-size:0.6rem}.pm.multi{font-size:0.4rem}.card{padding:20px}.q-card{padding:18px}.dpad{grid-template-columns:46px 46px 46px;grid-template-rows:46px 46px 46px}.dpad-btn{width:46px;height:46px}}

</style>

// SOUND
class SoundEngine{constructor(){this.ctx=null;this.enabled=true}init(){if(this.ctx)return;try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}play(type){if(!this.enabled||!this.ctx)return;var now=this.ctx.currentTime,osc=this.ctx.createOscillator(),gain=this.ctx.createGain();osc.connect(gain);gain.connect(this.ctx.destination);switch(type){case'move':osc.frequency.setValueAtTime(300,now);osc.frequency.exponentialRampToValueAtTime(400,now+0.05);gain.gain.setValueAtTime(0.06,now);gain.gain.exponentialRampToValueAtTime(0.001,now+0.08);osc.start(now);osc.stop(now+0.08);break;case'correct':osc.frequency.setValueAtTime(523,now);osc.frequency.setValueAtTime(659,now+0.1);osc.frequency.setValueAtTime(784,now+0.2);gain.gain.setValueAtTime(0.12,now);gain.gain.exponentialRampToValueAtTime(0.001,now+0.4);osc.start(now);osc.stop(now+0.4);break;case'wrong':osc.type='sawtooth';osc.frequency.setValueAtTime(200,now);osc.frequency.exponentialRampToValueAtTime(100,now+0.3);gain.gain.setValueAtTime(0.1,now);gain.gain.exponentialRampToValueAtTime(0.001,now+0.3);osc.start(now);osc.stop(now+0.3);break;case'powerup':osc.frequency.setValueAtTime(400,now);osc.frequency.exponentialRampToValueAtTime(1200,now+0.3);gain.gain.setValueAtTime(0.1,now);gain.gain.exponentialRampToValueAtTime(0.001,now+0.35);osc.start(now);osc.stop(now+0.35);break;case'finish':osc.frequency.setValueAtTime(523,now);osc.frequency.setValueAtTime(784,now+0.15);osc.frequency.setValueAtTime(1047,now+0.3);gain.gain.setValueAtTime(0.15,now);gain.gain.exponentialRampToValueAtTime(0.001,now+0.5);osc.start(now);osc.stop(now+0.5);break;case'tick':osc.frequency.setValueAtTime(800,now);gain.gain.setValueAtTime(0.03,now);gain.gain.exponentialRampToValueAtTime(0.001,now+0.04);osc.start(now);osc.stop(now+0.04);break;case'combo':osc.type='triangle';osc.frequency.setValueAtTime(600,now);osc.frequency.exponentialRampToValueAtTime(1200,now+0.2);gain.gain.setValueAtTime(0.12,now);gain.gain.exponentialRampToValueAtTime(0.001,now+0.25);osc.start(now);osc.stop(now+0.25);break}}}
var sound=new SoundEngine();

// QUESTIONS

function renderDuration(app){var opts=[{d:10,l:'Cepat',e:'\u26A1'},{d:15,l:'Normal',e:'\u{1F44D}'},{d:25,l:'Panjang',e:'\u{1F4DA}'},{d:40,l:'Marathon',e:'\u{1F9E0}'}];var btns='';opts.forEach(function(o){btns+='<button class="dur-btn'+(gs.duration===o.d?' active':'')+'" onclick="gs.duration='+o.d+';render()"><span>'+o.e+' '+o.l+'</span><span style="font-size:0.85rem;opacity:0.7">'+o.d+' menit</span></button>'});app.innerHTML='<div class="screen"><div class="card bounce-in" style="max-width:400px"><h2 class="tf" style="font-size:1.8rem;color:#5b21b6;text-align:center;margin-bottom:20px">\u23F1\uFE0F Durasi</h2>'+btns+'<label class="fog-toggle"><input type="checkbox" '+(gs.fogOfWar?'checked':'')+' onchange="gs.fogOfWar=this.checked"><span style="font-weight:700;color:#555;font-size:0.85rem">\u{1F32B}\uFE0F Fog of War</span></label><div style="display:flex;gap:10px;justify-content:center;margin-top:16px"><button class="btn-outline" onclick="gs.screen=\'rules\';render()">\u2190 Kembali</button><button class="btn btn-primary btn-sm" onclick="startGame()">\u{1F3AE} Mulai!</button></div></div></div>'}

function startGame(){generateMaze();initQPool();gs.currentTeam=0;gs.controlTeam=0;gs.questionsAnswered=0;gs.finishOrder=[];gs.positions=[];for(var i=0;i<gs.numTeams;i++)gs.positions.push([1,1]);gs.achievements=[];gs.screen='maze';render();startTimer()}

function renderMaze(app){var ct=gs.controlTeam,pr=gs.positions[ct][0],pc=gs.positions[ct][1];var m=Math.floor(gs.timeLeft/60),s=gs.timeLeft%60;var timerStr=m+':'+(s<10?'0':'')+s;var timerCls=gs.timeLeft<=60?'timer danger':'timer';var teamBtns='';for(var i=0;i<gs.numTeams;i++){teamBtns+='<div class="tb'+(i===ct?' active':'')+'" style="background:'+COLORS[i]+(i===ct?'':'80')+'" onclick="gs.controlTeam='+i+';render()">'+CHARS[gs.teamChars[i]]+' '+gs.scores[i]+(gs.finishOrder.indexOf(i)>=0?' \u2713':'')+'</div>'}var puSlots='';if(gs.powerups[ct]&&gs.powerups[ct].length){gs.powerups[ct].forEach(function(pu,idx){puSlots+='<div class="pu-slot" title="'+pu.name+'" onclick="activatePU('+ct+','+idx+')">'+pu.icon+'</div>'})}else{puSlots='<span class="pu-empty">kosong</span>'}var comboBadge='';if(gs.combos[ct]>=2)comboBadge='<span class="streak-glow" style="background:#ff9800;color:#fff;font-size:0.7rem;font-weight:700;padding:2px 8px;border-radius:50px;margin-left:6px">\u{1F525}x'+gs.combos[ct]+'</span>';var cells='';for(var r=0;r<21;r++){for(var c=0;c<21;c++){var cell=gs.maze[r][c];var dist=Math.abs(r-pr)+Math.abs(c-pc);if(gs.fogOfWar&&dist>gs.fogRadius){cells+='<div class="mc mc-fog"></div>';continue}var cls='mc ';var content='';if(cell===0)cls+='mc-wall';else if(cell===3){cls+='mc-exit';content='\u{1F6AA}'}else if(cell===2){cls+='mc-q';content='\u2753'}else{cls+='mc-path';var pk=r+','+c;if(gs.powerupCells[pk])content=gs.powerupCells[pk].icon}var players='';for(var t=0;t<gs.numTeams;t++){if(gs.positions[t][0]===r&&gs.positions[t][1]===c){var multi=gs.numTeams>1;for(var t2=0;t2<gs.numTeams;t2++){if(t2!==t&&gs.positions[t2][0]===r&&gs.positions[t2][1]===c){multi=true;break}}players+='<span class="pm'+(multi?' multi':'')+'">'+CHARS[gs.teamChars[t]]+'</span>'}}if(players)content=players;cells+='<div class="'+cls+'">'+content+'</div>'}}app.innerHTML='<div class="maze-screen"><div class="maze-topbar"><div style="display:flex;align-items:center;gap:6px"><span style="color:#fff;font-size:0.9rem">\u23F1\uFE0F</span><span id="timer-display" class="'+timerCls+'">'+timerStr+'</span></div><div class="team-info">'+CHARS[gs.teamChars[ct]]+' '+gs.teams[ct]+comboBadge+'</div><div class="top-btns"><button onclick="gs.paused=true;renderPause()">\u23F8\uFE0F</button><button onclick="gs.screen=\'scoreboard\';render()">\u{1F4CA}</button></div></div><div class="maze-teambar">'+teamBtns+'</div><div class="maze-pubar"><span class="pu-label">PU:</span>'+puSlots+'</div><div class="maze-area"><div class="maze-wrap"><div class="maze-grid" style="grid-template-columns:repeat(21,1fr)">'+cells+'</div></div></div><div class="maze-controls"><div class="dpad"><button class="dpad-btn dpad-up" ontouchstart="event.preventDefault();move(-1,0)" onclick="move(-1,0)">\u2191</button><button class="dpad-btn dpad-left" ontouchstart="event.preventDefault();move(0,-1)" onclick="move(0,-1)">\u2190</button><div class="dpad-btn dpad-center">'+CHARS[gs.teamChars[ct]]+'</div><button class="dpad-btn dpad-right" ontouchstart="event.preventDefault();move(0,1)" onclick="move(0,1)">\u2192</button><button class="dpad-btn dpad-down" ontouchstart="event.preventDefault();move(1,0)" onclick="move(1,0)">\u2193</button></div></div></div>'}

function move(dr,dc){var ti=gs.controlTeam,r=gs.positions[ti][0],c=gs.positions[ti][1],nr=r+dr,nc=c+dc;if(nr<0||nr>=21||nc<0||nc>=21)return;var cell=gs.maze[nr][nc];if(cell===0)return;sound.play('move');gs.totalMoves[ti]++;var pk=nr+','+nc;if(gs.powerupCells[pk]){var pu=gs.powerupCells[pk];if(gs.powerups[ti].length<3){gs.powerups[ti].push(pu);sound.play('powerup');showToast(pu.icon+' '+gs.teams[ti]+': '+pu.name+'!')}delete gs.powerupCells[pk]}if(cell===2){gs.currentQuestion=getQ();gs.currentTeam=ti;gs.previousPos=[r,c];gs.targetPos=[nr,nc];gs.questionTimerStarted=false;gs.shuffledOpts=null;gs.activePowerup=null;gs.screen='question';render()}else if(cell===3){gs.positions[ti]=[nr,nc];if(gs.finishOrder.indexOf(ti)===-1){gs.finishOrder.push(ti);gs.scores[ti]+=50;sound.play('finish');showToast('\u{1F3C6} '+gs.teams[ti]+' EXIT! +50!');spawnConfetti(20)}if(gs.finishOrder.length>=gs.numTeams)setTimeout(function(){gs.screen='winner';render()},1500);else render()}else{gs.positions[ti]=[nr,nc];render()}}

function activatePU(ti,idx){var pu=gs.powerups[ti][idx];if(!pu)return;gs.activePowerup=pu;gs.powerups[ti].splice(idx,1);showToast(pu.icon+' '+pu.name+' aktif!');sound.play('powerup');render()}

function renderQuestion(app){var q=gs.currentQuestion;if(!q)return;var isEasy=questions.easy.indexOf(q)>=0,isMed=questions.medium.indexOf(q)>=0;var level=isEasy?'Mudah':isMed?'Sedang':'HOTS';var lc=isEasy?'#00b894':isMed?'#f39c12':'#e74c3c';var stars=isEasy?'\u2B50':isMed?'\u2B50\u2B50':'\u2B50\u2B50\u2B50';if(!gs.shuffledOpts)gs.shuffledOpts=shuffle([0,1,2,3]);if(!gs.questionTimerStarted){gs.questionTimerStarted=true;gs.questionTimeLeft=30;if(gs.questionTimer)clearInterval(gs.questionTimer);gs.questionTimer=setInterval(function(){gs.questionTimeLeft--;var el=document.getElementById('q-timer');if(el){el.textContent=gs.questionTimeLeft+'s';el.className=gs.questionTimeLeft<=10?'q-timer danger':'q-timer'}if(gs.questionTimeLeft<=10)sound.play('tick');if(gs.questionTimeLeft<=0){clearInterval(gs.questionTimer);timeoutQ()}},1000)}var hidden=[];if(gs.activePowerup&&gs.activePowerup.id==='hint'){var wrong=[0,1,2,3].filter(function(i){return i!==q.ans});hidden=shuffle(wrong).slice(0,2);gs.activePowerup=null}var opts='';gs.shuffledOpts.forEach(function(oi,di){var dis=hidden.indexOf(oi)>=0;opts+='<button class="opt-btn'+(dis?' disabled':'')+'" onclick="answer('+oi+')"'+(dis?' disabled':'')+'>  <span class="opt-letter">'+'ABCD'[di]+'</span><span>'+q.opts[oi]+'</span></button>'});var comboBadge='';if(gs.combos[gs.currentTeam]>=2)comboBadge='<span class="qt-combo">\u{1F525}x'+gs.combos[gs.currentTeam]+'</span>';var actions='';if(gs.powerups[gs.currentTeam].some(function(p){return p.id==='skip'}))actions+='<button class="q-act-skip" onclick="useSkip()">\u23ED\uFE0F Skip</button>';if(!hidden.length&&gs.powerups[gs.currentTeam].some(function(p){return p.id==='hint'}))actions+='<button class="q-act-hint" onclick="useHint()">\u{1F4A1} Hint</button>';actions+='<button class="q-act-surr" onclick="surrender()">\u{1F62D} Nyerah</button>';app.innerHTML='<div class="q-screen"><div class="q-card slide-up"><div class="q-header"><div class="q-badges"><span class="q-badge" style="background:'+lc+'">'+stars+' '+level+'</span><span class="q-badge" style="background:#667eea">'+q.cat+'</span></div><span id="q-timer" class="q-timer'+(gs.questionTimeLeft<=10?' danger':'')+'">'+gs.questionTimeLeft+'s</span></div><div class="q-team"><span class="qt-char">'+CHARS[gs.teamChars[gs.currentTeam]]+'</span><span class="qt-name">'+gs.teams[gs.currentTeam]+'</span>'+comboBadge+'</div><p class="q-text">'+q.q+'</p><div class="q-opts">'+opts+'</div><div class="q-actions">'+actions+'</div></div></div>'}

function answer(sel){var q=gs.currentQuestion,ti=gs.currentTeam,correct=sel===q.ans;clearInterval(gs.questionTimer);gs.questionTimerStarted=false;var isEasy=questions.easy.indexOf(q)>=0,isMed=questions.medium.indexOf(q)>=0;var basePoints=isEasy?10:isMed?20:30;var points=basePoints;if(correct){gs.combos[ti]++;if(gs.combos[ti]>gs.maxCombos[ti])gs.maxCombos[ti]=gs.combos[ti];var comboMult=gs.combos[ti]>=5?3:gs.combos[ti]>=3?2:1;if(gs.activePowerup&&gs.activePowerup.id==='double'){points*=2;gs.activePowerup=null}points*=comboMult;gs.positions[ti]=gs.targetPos;gs.scores[ti]+=points;gs.correctAnswers[ti]++;sound.play('correct');if(gs.combos[ti]>=3)sound.play('combo');checkAch(ti);gs.feedbackData={correct:true,points:points,combo:gs.combos[ti],q:q}}else{gs.combos[ti]=0;gs.wrongAnswers[ti]++;var hasShield=gs.activePowerup&&gs.activePowerup.id==='shield';if(hasShield){gs.activePowerup=null;showToast('\u{1F6E1}\uFE0F Shield! Tidak mundur.')}else if(gs.previousPos)gs.positions[ti]=gs.previousPos;sound.play('wrong');gs.feedbackData={correct:false,points:0,combo:0,q:q,shielded:hasShield}}gs.activePowerup=null;gs.questionsAnswered++;gs.shuffledOpts=null;gs.screen='feedback';render()}

function timeoutQ(){clearInterval(gs.questionTimer);gs.questionTimerStarted=false;var ti=gs.currentTeam;gs.combos[ti]=0;gs.wrongAnswers[ti]++;if(gs.previousPos){gs.positions[ti]=gs.previousPos;var r=gs.previousPos[0],c=gs.previousPos[1];var dirs=[[-1,0],[1,0],[0,-1],[0,1]];for(var d=0;d<dirs.length;d++){var nr=r+dirs[d][0],nc=c+dirs[d][1];if(nr>=0&&nr<21&&nc>=0&&nc<21&&gs.maze[nr][nc]!==0){gs.positions[ti]=[nr,nc];break}}}sound.play('wrong');gs.feedbackData={correct:false,points:0,combo:0,q:gs.currentQuestion,timeout:true};gs.shuffledOpts=null;gs.questionsAnswered++;gs.screen='feedback';render()}

function surrender(){clearInterval(gs.questionTimer);gs.questionTimerStarted=false;var ti=gs.currentTeam;gs.combos[ti]=0;gs.wrongAnswers[ti]++;gs.positions[ti]=[1,1];sound.play('wrong');gs.feedbackData={correct:false,points:0,combo:0,q:gs.currentQuestion,surrender:true};gs.shuffledOpts=null;gs.questionsAnswered++;gs.screen='feedback';render()}

function useSkip(){clearInterval(gs.questionTimer);gs.questionTimerStarted=false;var idx=-1;for(var i=0;i<gs.powerups[gs.currentTeam].length;i++){if(gs.powerups[gs.currentTeam][i].id==='skip'){idx=i;break}}if(idx>=0)gs.powerups[gs.currentTeam].splice(idx,1);showToast('\u23ED\uFE0F Skip!');gs.shuffledOpts=null;gs.screen='maze';render()}
function useHint(){var ti=gs.currentTeam,idx=-1;for(var i=0;i<gs.powerups[ti].length;i++){if(gs.powerups[ti][i].id==='hint'){idx=i;break}}if(idx>=0){gs.activePowerup=gs.powerups[ti][idx];gs.powerups[ti].splice(idx,1);gs.shuffledOpts=null;render()}}

function renderFeedback(app){var d=gs.feedbackData,q=d.q;var icon,title,subtitle,color;if(d.correct){icon='\u{1F389}';title='Benar!';subtitle='+'+d.points+' poin'+(d.combo>=3?' (Combo x'+d.combo+'!)':'');color='#2e7d32'}else if(d.timeout){icon='\u23F0';title='Waktu Habis!';subtitle='Mundur 2 petak';color='#e65100'}else if(d.surrender){icon='\u{1F62D}';title='Nyerah!';subtitle='Kembali ke START';color='#c62828'}else if(d.shielded){icon='\u{1F6E1}\uFE0F';title='Salah, tapi Shield!';subtitle='Tidak mundur';color='#1565c0'}else{icon='\u{1F605}';title='Salah!';subtitle='Mundur 1 petak';color='#c62828'}app.innerHTML='<div class="screen"><div class="card bounce-in" style="max-width:480px;text-align:center"><div class="fb-icon">'+icon+'</div><h2 class="tf fb-title" style="color:'+color+'">'+title+'</h2><p class="fb-sub">'+subtitle+'</p><div class="fb-explain"><p class="fb-el">\u{1F4DA} Penjelasan:</p><p class="fb-et">'+q.exp+'</p></div><div class="fb-answer"><p class="fba-q"><strong>Soal:</strong> '+q.q+'</p><p class="fba-a">\u2705 Jawaban: '+q.opts[q.ans]+'</p></div><button class="btn btn-primary btn-block" onclick="gs.screen=\'maze\';render()">Lanjut \u2192</button></div></div>'}

function renderScoreboard(app){var sorted=gs.teams.map(function(t,i){return{name:t,score:gs.scores[i],idx:i,correct:gs.correctAnswers[i],combo:gs.maxCombos[i]}}).sort(function(a,b){return b.score-a.score});var rows='';sorted.forEach(function(t,rank){rows+='<div class="sb-row" style="background:'+COLORS_LIGHT[t.idx]+';border-left:4px solid '+COLORS[t.idx]+'"><div class="sb-left"><span class="sb-rank">#'+(rank+1)+'</span><span style="font-size:1.5rem">'+CHARS[gs.teamChars[t.idx]]+'</span><div><div class="sb-name">'+t.name+'</div><div class="sb-stats">\u2705'+t.correct+' | \u{1F525}max '+t.combo+'</div></div></div><span class="sb-score" style="color:'+COLORS[t.idx]+'">'+t.score+'</span></div>'});app.innerHTML='<div class="screen"><div class="card slide-up" style="max-width:480px"><h2 class="tf" style="font-size:1.8rem;color:#5b21b6;text-align:center;margin-bottom:20px">\u{1F4CA} Papan Skor</h2>'+rows+'<div style="display:flex;gap:10px;justify-content:center;margin-top:20px"><button class="btn-outline" onclick="gs.screen=\'maze\';render()">\u2190 Kembali</button><button class="btn btn-secondary btn-sm" onclick="gs.screen=\'winner\';clearInterval(gs.timerInterval);render()">\u{1F3C6} Akhiri</button></div></div></div>'}

function renderWinner(app){clearInterval(gs.timerInterval);clearInterval(gs.questionTimer);var sorted=gs.teams.map(function(t,i){return{name:t,score:gs.scores[i],idx:i,correct:gs.correctAnswers[i],wrong:gs.wrongAnswers[i],combo:gs.maxCombos[i],moves:gs.totalMoves[i]}}).sort(function(a,b){return b.score-a.score});var w=sorted[0];spawnConfetti(40);sound.play('finish');var medals=['\u{1F947}','\u{1F948}','\u{1F949}','4\uFE0F\u20E3'];var rankRows='';sorted.forEach(function(t,r){rankRows+='<div class="win-rank-row"><div class="win-rank-left"><span>'+medals[r]+'</span><span style="font-size:1.3rem">'+CHARS[gs.teamChars[t.idx]]+'</span><span style="font-weight:700;color:#333;font-size:0.85rem">'+t.name+'</span></div><div style="text-align:right"><div class="win-rank-score" style="color:'+COLORS[t.idx]+'">'+t.score+'</div><div class="win-rank-sub">\u2705'+t.correct+' \u{1F525}x'+t.combo+'</div></div></div>'});app.innerHTML='<div class="screen"><div class="card bounce-in" style="max-width:480px;text-align:center;max-height:90vh;overflow-y:auto"><div style="font-size:4.5rem;margin-bottom:8px">\u{1F3C6}</div><h2 class="tf" style="font-size:2.2rem;color:#f59e0b;margin-bottom:8px">SELAMAT!</h2><div style="font-size:3.5rem;margin:8px 0">'+CHARS[gs.teamChars[w.idx]]+'</div><h3 class="tf" style="font-size:1.8rem;color:'+COLORS[w.idx]+';margin-bottom:4px">'+w.name+'</h3><p style="font-size:1.5rem;font-weight:700;color:#555;margin-bottom:8px">'+w.score+' Poin</p><div style="display:flex;justify-content:center;gap:12px;font-size:0.8rem;color:#888;margin-bottom:16px"><span>\u2705 '+w.correct+'</span><span>\u274C '+w.wrong+'</span><span>\u{1F525} max x'+w.combo+'</span><span>\u{1F463} '+w.moves+'</span></div><div class="win-ranks"><p style="text-align:center;font-size:0.8rem;font-weight:700;color:#999;margin-bottom:8px">Peringkat</p>'+rankRows+'</div><button class="btn btn-primary" onclick="resetGame()">\u{1F504} Main Lagi</button></div></div>'}

function renderPause(){var overlay=document.createElement('div');overlay.id='pause-overlay';overlay.className='pause-overlay';overlay.innerHTML='<div class="pause-box"><h2>\u23F8\uFE0F Pause</h2><p>Game dijeda</p><div class="pause-btns"><button class="btn btn-primary" onclick="gs.paused=false;document.getElementById(\'pause-overlay\').remove()">\u25B6\uFE0F Lanjut</button><button class="btn btn-secondary btn-sm" onclick="gs.paused=false;document.getElementById(\'pause-overlay\').remove();gs.screen=\'scoreboard\';render()">\u{1F4CA} Skor</button><button class="btn-outline" onclick="gs.paused=false;document.getElementById(\'pause-overlay\').remove();resetGame()">\u{1F3E0} Keluar</button></div></div>';document.body.appendChild(overlay)}

function resetGame(){clearInterval(gs.timerInterval);clearInterval(gs.questionTimer);gs.screen='home';gs.scores=[0,0,0,0];gs.combos=[0,0,0,0];gs.questionsAnswered=0;gs.currentTeam=0;gs.controlTeam=0;gs.finishOrder=[];gs.teams=[];gs.teamChars=[0,1,2,3];gs.numTeams=2;gs.shuffledOpts=null;gs.activePowerup=null;render()}

document.addEventListener('keydown',function(e){if(gs.screen!=='maze')return;var k=e.key.toLowerCase();var dr=0,dc=0;if(k==='arrowup'||k==='w'){dr=-1;e.preventDefault()}else if(k==='arrowdown'||k==='s'){dr=1;e.preventDefault()}else if(k==='arrowleft'||k==='a'){dc=-1;e.preventDefault()}else if(k==='arrowright'||k==='d'){dc=1;e.preventDefault()}if(dr||dc)move(dr,dc)});

document.addEventListener('touchstart',function(e){if(gs.screen!=='maze')return;tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',function(e){if(gs.screen!=='maze')return;var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;var th=50;var dr=0,dc=0;if(Math.abs(dx)>Math.abs(dy)){if(dx>th)dc=1;else if(dx<-th)dc=-1}else{if(dy>th)dr=1;else if(dy<-th)dr=-1}if(dr||dc)move(dr,dc)});

render();

startGame = function() {
  if (typeof EduProjector !== 'undefined' && EduProjector.isActive()) {
    saveTeams();
    EduProjector.showLobby({
      title: 'Labirin Pengetahuan',
      subtitle: gs.numTeams + ' Tim • ' + gs.duration + ' Menit',
      players: gs.teams.slice(0, gs.numTeams),
      chars: gs.teamChars.slice(0, gs.numTeams),
      charEmojis: CHARS,
      colors: COLORS
    }, function() {
      generateMaze(); initQPool();
      gs.currentTeam = 0; gs.controlTeam = 0;
      gs.questionsAnswered = 0; gs.finishOrder = [];
      gs.positions = [];
      for (var i = 0; i < gs.numTeams; i++) gs.positions.push([1,1]);
      gs.achievements = []; gs.screen = 'maze';
      render(); startTimer();
      _updateLabirinScorebar();
    });
  } else {
    _origStartGame();
  }
};

var _origRender = render;
render = function() {
  _origRender();
  _updateLabirinScorebar();
};

function _updateLabirinScorebar() {
  if (typeof EduProjector === 'undefined') return;
  if (gs.screen === 'maze' || gs.screen === 'question' || gs.screen === 'feedback') {
    EduProjector.updateScoreboardBar(
      gs.teams.slice(0, gs.numTeams),
      gs.scores.slice(0, gs.numTeams),
      gs.teamChars.slice(0, gs.numTeams),
      COLORS, gs.controlTeam, CHARS
    );
  }
}

// Celebration on correct answer
var _origAnswer = answer;
answer = function(sel) {
  var q = gs.currentQuestion, correct = sel === q.ans;
  _origAnswer(sel);
  if (correct && typeof EduProjector !== 'undefined' && EduProjector.isActive()) {
    var combo = gs.combos[gs.currentTeam];
    if (combo >= 5) EduProjector.showCelebration('🔥 COMBO x' + combo + '! 🔥', 1500);
    else if (combo >= 3) EduProjector.showCelebration('⚡ COMBO x' + combo + '!', 1200);
  }
};
</script>
<script src="../shared/edu-theme.js"></script>
<script src="../shared/edu-projector.js"></script>
</body>
